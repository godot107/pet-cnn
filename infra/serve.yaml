AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pet-cnn serving: a SageMaker Serverless Inference endpoint (scales to zero, no idle cost) behind
  an API Gateway REST API that calls InvokeEndpoint directly (no Lambda). Callers need an API key;
  a usage plan caps requests per second and per day. Optional custom domain (e.g. pets.willieman.com).
  POST /predict with raw image bytes. Deploy with deploy/deploy_serve.sh.

Parameters:
  ModelDataUrl:
    Type: String
    Description: s3://<lab bucket>/models/<name>/<hash>/model.tar.gz (python -m petcnn sm-package)
  ImageUri:
    Type: String
    Description: PyTorch inference container (config.yaml serve.image_uri)
  ExecutionRoleArn:
    Type: String
    Description: The lab stack's SageMaker role (reads the model from S3, pulls the container)
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9.-]+\\.[a-z]{2,}$"
    Description: >-
      Optional, e.g. pets.willieman.com. Stack creation waits for the ACM certificate: add the
      validation CNAME shown in the stack events at the DNS host (Spaceship), then the
      CustomDomainTarget output as a CNAME for the name itself.
  DailyQuota:
    Type: Number
    Default: 500
    Description: Requests per day across the API key; the hard cost cap.
  MemoryMb:
    Type: Number
    Default: 3072
    AllowedValues: [1024, 2048, 3072, 4096, 5120, 6144]
  MaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 5

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  Model:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !Ref ExecutionRoleArn
      PrimaryContainer:
        Image: !Ref ImageUri
        ModelDataUrl: !Ref ModelDataUrl
        Environment:
          SAGEMAKER_PROGRAM: inference.py
          SAGEMAKER_SUBMIT_DIRECTORY: /opt/ml/model/code

  EndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: AllTraffic
          ModelName: !GetAtt Model.ModelName
          ServerlessConfig:
            MemorySizeInMB: !Ref MemoryMb
            MaxConcurrency: !Ref MaxConcurrency

  Endpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointConfigName: !GetAtt EndpointConfig.EndpointConfigName

  # API Gateway signs the call to SageMaker with this role; nothing else can invoke the endpoint.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-endpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Ref Endpoint

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: pet-cnn
      EndpointConfiguration: { Types: [REGIONAL] }
      BinaryMediaTypes: [image/jpeg, image/png]   # pass image bytes through untouched
      DisableExecuteApiEndpoint: false

  PredictResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: predict

  PredictMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref PredictResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters: { method.request.header.Content-Type: true }
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:runtime.sagemaker:path/endpoints/${Endpoint.EndpointName}/invocations"
        Credentials: !GetAtt ApiRole.Arn
        PassthroughBehavior: WHEN_NO_TEMPLATES
        TimeoutInMillis: 29000
        RequestParameters:
          integration.request.header.Content-Type: method.request.header.Content-Type
          integration.request.header.Accept: "'application/json'"
        IntegrationResponses:
          - StatusCode: "200"
          - StatusCode: "400"
            SelectionPattern: "4\\d{2}"      # bad image -> SageMaker ModelError
          - StatusCode: "503"
            SelectionPattern: "5\\d{2}"      # cold start / throttled endpoint
      MethodResponses:
        - StatusCode: "200"
        - StatusCode: "400"
        - StatusCode: "503"

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: PredictMethod
    Properties:
      RestApiId: !Ref Api

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: v1

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: Stage
    Properties:
      UsagePlanName: pet-cnn-demo
      ApiStages: [{ ApiId: !Ref Api, Stage: v1 }]
      Throttle: { BurstLimit: 5, RateLimit: 2 }
      Quota: { Limit: !Ref DailyQuota, Period: DAY }

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: pet-cnn-demo
      Enabled: true

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  # --- optional custom domain --------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  CustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref Certificate
      EndpointConfiguration: { Types: [REGIONAL] }
      SecurityPolicy: TLS_1_2

  BasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      DomainName: !Ref CustomDomain
      RestApiId: !Ref Api
      Stage: v1

Outputs:
  ApiUrl:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1"
  ApiKeyId:
    Value: !Ref ApiKey
    Description: "aws apigateway get-api-key --api-key <id> --include-value"
  CustomDomainTarget:
    Condition: HasDomain
    Value: !GetAtt CustomDomain.RegionalDomainName
    Description: CNAME the custom domain to this at the DNS host
  EndpointName:
    Value: !GetAtt Endpoint.EndpointName
